<body>
  <div id="header-wrapper">
    <div id="header" class="row">

  <div id="content" class="column">

      <div class="rule"></div>

        Information About Which Systems Support Rotur

  <div class="systems-list" id="systems-list">

</div>

  <script src="https://kit.fontawesome.com/16f6b70bf6.js" crossorigin="anonymous"></script>
  <script src="../nav.js"></script>
  <script>
   async function fetchURL(url) {
   	const response = await fetch(url);
   	const data = await response.json();
   	return data;
   }

   async function loadInfo() {
   	let list = document.getElementsByClassName("systems-list")
   	let data = await fetchURL("https://raw.githubusercontent.com/RoturTW/main/refs/heads/main/systems.json")
   	console.log(data)
   	let systems = Object.keys(data)
   	let html = ""
   	for (const i in systems) {
   		console.log(systems[i])
   		let systemData = data[systems[i]]
   		let item = '<li class="system-item" onclick="window.location.href=\'' + systemData.URL + '\'">\n'
      if (!["", undefined, null].includes(systemData.showOffURL)) {
        item += '<img class="system-screenshot" src="' + systemData.showOffURL + '" alt="' + systems[i] + '">\n'
      }
      item += '<div class="system-content">\n'
      item += '<h2>' + systems[i] + '</h2>\n'
      item += '<p>'
        if (!["", undefined, null].includes(systemData.description)) {
          item += systemData.description
        } else {
          item += 'No Description Was Provided.'
        }
        item += '</p>\n'
        item += '<div class="system-meta">\n'
        item += '<span>Created By ' + systemData.author + ' On Rotur.</span>\n'
        if (!["", undefined, null].includes(systemData.designation)) {
          item += '<span>Designated \'' + systemData.designation + '\' on Rotur.</span>\n'
        } else {
          item += '<span>This system has no Rotur designation right now.</span>\n'
        }
      if (systemData.languages.length !== 0) {
        item += '<span>Languages: ' + systemData.languages.join(', ') + '.</span>\n'
      }
        item += '</div>\n'
      item += '</div>\n'
      item += '</li>\n'
   		html += item
   	}
   	console.log(html)
   	list[0].innerHTML = html
   }

   loadInfo()
  </script>
  <script src="nav.js"></script>
